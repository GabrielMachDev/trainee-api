name: CI Pipeline

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Instalar linter
        run: pip install flake8
      - name: Rodar lint
        run: flake8 .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Rodar testes
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      - name: Login no DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build da imagem
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/trainee-api:${{ github.sha }} .
      - name: Push da imagem
        run: docker push ${{ secrets.DOCKER_USERNAME }}/trainee-api:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Simular deploy
        run: |
          echo "Simulando deploy no ECS..."
          echo "Comando: terraform apply -auto-approve"
          echo "Imagem: ${{ secrets.DOCKER_USERNAME }}/trainee-api:${{ github.sha }}"